# Builds and tests the Windows app on GitHub's Windows machines (Flutter
# can't build Windows apps on Linux). On a published release, attaches the
# zip and installer and adds them to SHA256SUMS.
#
# Actions are pinned to full commit SHAs so a moved tag can't change what
# runs here.
name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_EVENT_NAME -eq 'release' -and "${{ github.event.release.tag_name }}" -ne "v$v") {
            throw "Release tag ${{ github.event.release.tag_name }} doesn't match pubspec version $v"
          }

      - run: flutter pub get

      - name: Test (includes Windows-only networking tests)
        run: flutter test -r expanded

      - run: flutter build windows --release

      - name: Bundle the Visual C++ runtime
        # Flutter apps need it and not every PC has it; Microsoft allows
        # shipping these DLLs next to the app.
        shell: pwsh
        run: |
          $dest = "build\windows\x64\runner\Release"
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" $dest
          }

      - name: Portable zip
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force dist, stage\NetWho | Out-Null
          Copy-Item -Recurse build\windows\x64\runner\Release\* stage\NetWho
          Copy-Item LICENSE stage\NetWho
          Compress-Archive -Path stage\NetWho -DestinationPath "dist\netwho-$v-windows-x64.zip"

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $src = (Resolve-Path build\windows\x64\runner\Release).Path
          $out = (Resolve-Path dist).Path
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" "/DSourceDir=$src" "/DOutputDir=$out" packaging\windows\netwho.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Checksums
        shell: pwsh
        run: Get-FileHash dist\* -Algorithm SHA256 | Format-Table -AutoSize

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: netwho-windows
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: netwho-windows
          path: dist

      - name: Attach to release and update SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cd dist
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p SHA256SUMS || touch SHA256SUMS
          grep -v -- '-windows-' SHA256SUMS > sums.tmp || true
          sha256sum -- *-windows-* >> sums.tmp
          sort -k2 sums.tmp > SHA256SUMS && rm sums.tmp
          cat SHA256SUMS
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber -- *-windows-* SHA256SUMS
